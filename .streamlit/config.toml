[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# Pure Comfort brand palette (pulled from pure-comfort.com stylesheet).
[theme]
base = "light"
primaryColor = "#0066EE"             # Pure Comfort blue — buttons, sliders, focus rings
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F7" # sidebar + secondary panels
textColor = "#1A1A1A"
font = "sans serif"
