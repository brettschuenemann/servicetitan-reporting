name: Daily CSR call list (Fey)

on:
  schedule:
    # Primary + retry 1h later. GitHub's free-tier cron is best-effort and
    # occasionally skips. The script's idempotency guard skips its work
    # if a successful send was logged in the last 6h, so the retry is a
    # no-op when the primary succeeded. Weekdays only.
    - cron: '0 13 * * 1-5'   # 8 AM ET standard / 9 AM EDT (primary)
    - cron: '0 14 * * 1-5'   # 9 AM ET standard / 10 AM EDT (retry)
  workflow_dispatch:   # allow a manual "Run workflow" from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send CSR daily email
        env:
          ST_APP_KEY: ${{ secrets.ST_APP_KEY }}
          ST_TENANT_ID: ${{ secrets.ST_TENANT_ID }}
          ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID }}
          ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET }}
          ST_ENVIRONMENT: ${{ secrets.ST_ENVIRONMENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # FEY_EMAIL_TO = primary recipient (Fey).
          # EMAIL_TO     = CC (Brett) for visibility.
          FEY_EMAIL_TO: ${{ secrets.FEY_EMAIL_TO }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Used to build the per-row outcome-action links in the email.
          # Example: https://your-app.streamlit.app
          # If unset, the action links are hidden (graceful degradation).
          STREAMLIT_BASE_URL: ${{ secrets.STREAMLIT_BASE_URL }}
        run: python scripts/send_csr_daily_email.py
