name: Daily CSR call list (Fey)

on:
  schedule:
    # 13:00 UTC = 8:00 AM ET (Standard) / 9:00 AM ET (Daylight).
    # GitHub doesn't honor DST. 8 AM standard / 9 AM daylight is fine — list
    # is ready when she sits down most of the year.
    - cron: '0 13 * * *'
  workflow_dispatch:   # allow a manual "Run workflow" from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send CSR daily email
        env:
          ST_APP_KEY: ${{ secrets.ST_APP_KEY }}
          ST_TENANT_ID: ${{ secrets.ST_TENANT_ID }}
          ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID }}
          ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET }}
          ST_ENVIRONMENT: ${{ secrets.ST_ENVIRONMENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # FEY_EMAIL_TO = primary recipient (Fey).
          # EMAIL_TO     = CC (Brett) for visibility.
          FEY_EMAIL_TO: ${{ secrets.FEY_EMAIL_TO }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python scripts/send_csr_daily_email.py
