name: Daily CSR call list (Fey)

on:
  schedule:
    # 13:00 UTC weekdays = 8:00 AM ET (Standard) / 9:00 AM ET (Daylight).
    # Weekdays only — no point sending Fey a call list on Sat/Sun.
    # GitHub doesn't honor DST.
    - cron: '0 13 * * 1-5'
  workflow_dispatch:   # allow a manual "Run workflow" from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send CSR daily email
        env:
          ST_APP_KEY: ${{ secrets.ST_APP_KEY }}
          ST_TENANT_ID: ${{ secrets.ST_TENANT_ID }}
          ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID }}
          ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET }}
          ST_ENVIRONMENT: ${{ secrets.ST_ENVIRONMENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # FEY_EMAIL_TO = primary recipient (Fey).
          # EMAIL_TO     = CC (Brett) for visibility.
          FEY_EMAIL_TO: ${{ secrets.FEY_EMAIL_TO }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Used to build the per-row outcome-action links in the email.
          # Example: https://your-app.streamlit.app
          # If unset, the action links are hidden (graceful degradation).
          STREAMLIT_BASE_URL: ${{ secrets.STREAMLIT_BASE_URL }}
        run: python scripts/send_csr_daily_email.py
