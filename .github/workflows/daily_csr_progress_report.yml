name: Daily CSR progress report (EOD)

on:
  schedule:
    # Primary + retry 1h later. GitHub's free-tier cron is best-effort and
    # occasionally skips. The script's idempotency guard skips its work
    # if a successful send was logged in the last 6h, so the retry is a
    # no-op when the primary succeeded. Weekdays only.
    # 22:00 UTC = 5 PM CDT (most of year) / 4 PM CST (Nov–Mar).
    - cron: '0 22 * * 1-5'   # primary
    - cron: '0 23 * * 1-5'   # retry
  workflow_dispatch:   # manual "Run workflow" for testing

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send EOD progress report
        env:
          ST_APP_KEY: ${{ secrets.ST_APP_KEY }}
          ST_TENANT_ID: ${{ secrets.ST_TENANT_ID }}
          ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID }}
          ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET }}
          ST_ENVIRONMENT: ${{ secrets.ST_ENVIRONMENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python scripts/send_csr_progress_report.py
